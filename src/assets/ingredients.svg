<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
